{% extends "base.html" %}
{% block title %}404 | Page Not Found{% endblock title %}
{% load static %}
{% block content %}

<main class="w-full max-w-xl text-center mx-auto my-20">
        <!-- Logo -->
    <a href="/" class="inline-flex items-center gap-2 mb-10">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">
            C
        </div>

        <span class="text-2xl font-bold text-gray-900">
            Code<span class="text-blue-600">Nest</span>
        </span>
    </a>

    <!-- 404 Illustration -->
    <div class="mb-6">
        <h1 class="text-8xl sm:text-9xl font-extrabold text-blue-600 tracking-tight">
            404
        </h1>
    </div>

    <!-- Error Message -->
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4">
        Page Not Found
    </h2>

    <p class="text-gray-500 text-base sm:text-lg leading-relaxed mb-8">
        Oops! The page you're looking for doesn't exist
        or may have been moved.
    </p>

    <!-- Back Home Button -->
    <a href="/"
        class="inline-flex items-center justify-center px-7 py-3
                bg-blue-600 hover:bg-blue-700 text-white font-semibold
                rounded-xl transition duration-300 shadow-lg shadow-blue-600/20">

        Back to Home

    </a>

</main>


{% endblock content %}
