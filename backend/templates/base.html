{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} CodeNest | Developer Community {% endblock title %}</title>

    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block css %}
    {% endblock css %}
</head>
<body>
    <header>
        {% include "inc/header.html" %}
    </header>

    {% block content %}
    {% endblock content %}

    <footer>
        {% include "inc/footer.html" %}
    </footer>


    {% block js %}
        <script src="js/main.js"></script>
    {% endblock js %}
</body>
</html>
