{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} CodeNest | Developer Community {% endblock title %}</title>

    <!-- CDN Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block css %}
    {% endblock css %}
</head>
<body>
    <header class='sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-b border-gray-200 dark:border-gray-800'>
        {% include "inc/header.html" %}
    </header>

    {% block content %}
    {% endblock content %}
    
    <footer class='border-t border-gray-200 dark:border-gray-800 mt-10'>
        {% include "inc/footer.html" %}
    </footer>


    {% block js %}
        <script src="{% static "js/home.js" %}"></script>
        <script src="{% static 'js/app.js' %}"></script>
    {% endblock js %}
</body>
</html>
